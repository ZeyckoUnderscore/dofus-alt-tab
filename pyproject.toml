[project]
name = "dofus-alt-tab"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pywin32 (>=311,<312)",
    "psutil (>=7.1.3,<8.0.0)",
    "keyboard (>=0.13.5,<0.14.0)",
    "cmd2 (>=2.7.0,<3.0.0)",
]

[project.scripts]
dofus-alt-tab = "dofus_alt_tab.__main__:main"

[tool.poetry]
packages = [{include = "dofus_alt_tab", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
